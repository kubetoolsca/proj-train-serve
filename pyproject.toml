[project]
name = "proj-train-serve"
version = "0.1.0"
description = "Learning project for full machine learning training, workflow automation, serving, and API lifecycle."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Project Contributors" }
]

dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "yamllint>=1.35.0",
]

ml = [
  "torch",
  "torchvision",
  "lightning",
  "torchmetrics",
  "tensorboard",
  "optuna",
]

serving = [
  "fastapi",
  "uvicorn",
  "python-multipart",
  "tritonclient[http]",
]

onnx = [
  "onnx",
  "onnxruntime",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true